<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex,nofollow"/>
<title>404 — Página no encontrada · Emilio Pastor</title>
<meta name="description" content="La página que buscas no existe. Vuelve al inicio del portfolio de Emilio Pastor."/>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<link rel="canonical" href="https://emiliopastor.dev/404"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Geist+Mono:wght@400;500&family=Geist:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--white:#F5F3EE;--ink:#111111;--muted:#888880;--line:rgba(17,17,17,0.12);--accent:#D4460F}
html,body{height:100%}
body{
  background:var(--white);color:var(--ink);
  font-family:'Geist',sans-serif;
  display:flex;align-items:center;justify-content:center;
  padding:48px 24px;text-align:center;-webkit-font-smoothing:antialiased;
}
.wrap{max-width:560px}
.code{
  font-family:'Instrument Serif',serif;font-style:italic;
  font-size:clamp(7rem,18vw,12rem);line-height:.9;letter-spacing:-.04em;
  color:var(--ink);margin-bottom:18px;
}
h1{
  font-family:'Geist Mono',monospace;font-size:.78rem;font-weight:500;
  letter-spacing:.15em;text-transform:uppercase;color:var(--muted);
  margin-bottom:24px;
}
p{font-size:1rem;line-height:1.7;color:var(--muted);margin-bottom:32px}
a.home{
  display:inline-block;padding:12px 28px;background:var(--ink);color:var(--white);
  font-size:.78rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  text-decoration:none;border:none;transition:background .25s;
}
a.home:hover{background:var(--accent)}
a.home:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.mono{
  font-family:'Geist Mono',monospace;font-size:.62rem;letter-spacing:.12em;
  color:rgba(17,17,17,.35);text-transform:uppercase;margin-top:48px;
}
</style>
</head>
<body>
<main class="wrap">
  <div class="code" aria-hidden="true">404</div>
  <h1>Página no encontrada</h1>
  <p>La URL no existe o ha sido movida. Vuelve al inicio del portfolio para seguir explorando.</p>
  <a class="home" href="/">Volver al inicio</a>
  <div class="mono">Emilio Pastor · Desarrollador freelance</div>
</main>
</body>
</html>
